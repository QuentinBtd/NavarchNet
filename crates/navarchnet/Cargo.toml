[package]
name = "navarchnet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Self-hosted network orchestration controller"

[package.metadata.dist]
dist = true

[dependencies]
aws-config = { version = "=1.12.0", default-features = false, features = ["rt-tokio", "credentials-process", "sso"] }
aws-credential-types = "=1.3.0"
aws-sdk-sts = { version = "=1.119.0", default-features = false, features = ["rt-tokio"] }
aws-sdk-ram = { version = "=1.116.0", default-features = false, features = ["rt-tokio"] }
aws-sigv4 = "=1.6.0"
aws-smithy-http-client = { version = "=1.5.0", features = ["rustls-ring", "rt-tokio"] }
aws-types = "=1.6.0"
form_urlencoded = "=1.2.2"
quick-xml = "=0.42.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
jsonwebtoken = { version = "=11.1.0", features = ["aws_lc_rs"] }
anyhow = "1"
axum = "=0.8.9"
ipnet = "=2.12.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "=0.11.1"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "json", "migrate", "macros"] }
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tower-http = { version = "=0.7.1", features = ["fs", "trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "=12.0.1", features = ["serde-json-impl"] }
uuid = { version = "=1.28.0", features = ["v4"] }

[dev-dependencies]
aws-smithy-async = "=1.3.0"
aws-credential-types = { version = "=1.3.0", features = ["test-util"] }
aws-smithy-http-client = { version = "=1.5.0", features = ["test-util"] }
aws-smithy-types = "=1.8.1"
http = "=1.5.0"
rsa = "=0.9.10"
rand = "=0.8.8"
proptest = "=1.12.0"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
