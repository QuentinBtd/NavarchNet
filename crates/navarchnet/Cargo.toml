[package]
name = "navarchnet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Self-hosted network orchestration controller"

[package.metadata.dist]
dist = true

[dependencies]
jsonwebtoken = { version = "=11.1.0", features = ["rust_crypto"] }
anyhow = "1"
axum = "=0.8.9"
ipnet = "=2.12.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "=0.11.1"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "json", "migrate", "macros"] }
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tower-http = { version = "=0.7.1", features = ["fs", "trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "=12.0.1", features = ["serde-json-impl"] }
uuid = { version = "=1.28.0", features = ["v4"] }

[dev-dependencies]
rsa = "=0.9.10"
rand = "=0.8.8"
proptest = "=1.12.0"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
