name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
        env:
          POSTGRES_USER: navarchnet
          POSTGRES_PASSWORD: ci-only-disposable-database
          POSTGRES_DB: navarchnet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U navarchnet -d navarchnet"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://navarchnet:ci-only-disposable-database@127.0.0.1:5432/navarchnet
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.local/npm-cache
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format, lint, migrations, PostgreSQL, UI, type contract and crash smoke
        run: sh scripts/check.sh
      - name: License notices and dependency security policy
        run: |
          sh scripts/install-tools.sh deny
          .local/tools/bin/cargo-deny --locked check
          npm --prefix frontend audit --audit-level=high
          node scripts/notices.mjs --check
      - name: Install isolated browser runtime
        run: frontend/node_modules/.bin/playwright install --with-deps chromium
      - name: Real browser, backend and PostgreSQL journey
        run: npm --prefix frontend run e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: frontend/test-results/
          retention-days: 7
  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and exercise credential-free container demo
        env:
          DATABASE_PASSWORD: ci-only-disposable-database
          NAVARCHNET_ADMIN_TOKEN: ci-only-demo-admin-token-not-a-secret-0001
          NAVARCHNET_READER_TOKEN: ci-only-demo-reader-token-not-a-secret-0002
        run: |
          docker compose config --quiet
          docker compose up --build --wait --wait-timeout 180
          curl --fail http://127.0.0.1:8080/readyz
          curl --fail -H "Authorization: Bearer $NAVARCHNET_ADMIN_TOKEN" http://127.0.0.1:8080/api/v1/snapshot
          test "$(docker compose exec -T app id -u)" = 65532
          docker compose stop app
          docker compose up --no-build --wait --wait-timeout 60 app
          curl --fail http://127.0.0.1:8080/readyz
      - name: Teardown disposable database
        if: always()
        env:
          DATABASE_PASSWORD: ci-only-disposable-database
          NAVARCHNET_ADMIN_TOKEN: ci-only-demo-admin-token-not-a-secret-0001
          NAVARCHNET_READER_TOKEN: ci-only-demo-reader-token-not-a-secret-0002
        run: docker compose down --volumes
  package-dry-run:
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
        env:
          POSTGRES_USER: navarchnet
          POSTGRES_PASSWORD: ci-only-disposable-database
          POSTGRES_DB: navarchnet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U navarchnet -d navarchnet"
          --health-interval 5s --health-timeout 3s --health-retries 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.local/npm-cache
      DATABASE_URL: postgres://navarchnet:ci-only-disposable-database@127.0.0.1:5432/navarchnet
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: rustup toolchain install 1.99.0 --profile minimal
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: dist-${{ matrix.target }}
      - name: Build frontend and package without publishing
        env:
          DIST_TARGET: ${{ matrix.target }}
        run: |
          npm --prefix frontend ci --ignore-scripts --no-fund
          npm --prefix frontend run build
          sh scripts/install-tools.sh dist
          .local/tools/bin/dist plan --output-format=json > dist-plan.json
          .local/tools/bin/dist build --artifacts=local --target="$DIST_TARGET"
          sh scripts/verify-package.sh "$DIST_TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-dry-run-${{ matrix.target }}
          path: |
            target/distrib/*.tar.xz
            target/distrib/*.sha256
            dist-plan.json
          if-no-files-found: error
          retention-days: 7
